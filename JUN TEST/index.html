<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Future City HMI</title>
  <style>
    /* ----------------------------------------------------------------
       Colours as variables ("design tokens").
       HMI rule: keep normal things grey and calm, and use colour ONLY
       for things that need attention (warn = amber, alarm = red).
       ---------------------------------------------------------------- */
    :root {
      --bg: #f3f4f6;
      --panel: #ffffff;
      --border: #d9dce1;
      --text: #1d2330;
      --muted: #5f6878;
      --track: #e5e7eb;
      --fill: #8a93a3;
      --accent: #2563eb;
      --ok: #3f8f5f;
      --warn: #b7791f;
      --warn-bg: #fdf3e1;
      --alarm: #c53030;
      --alarm-bg: #fde8e8;
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b;
        --panel: #1b2029;
        --border: #2c333f;
        --text: #e6e9ef;
        --muted: #98a1b2;
        --track: #2a303b;
        --fill: #7d8697;
        --accent: #5b8def;
        --ok: #5fb37f;
        --warn: #e0a43a;
        --warn-bg: #3a2e17;
        --alarm: #f06060;
        --alarm-bg: #3d1d1f;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .num { font-variant-numeric: tabular-nums; } /* digits don't jump around */

    /* ---- Top bar ---- */
    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 18px; margin: 0; }
    header h1 span { color: var(--muted); font-weight: 400; }
    .conn { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
    .conn.lost .dot { background: var(--alarm); }
    .conn.lost { color: var(--alarm); font-weight: 600; }

    main { max-width: 1280px; margin: 0 auto; padding: 20px; display: grid; gap: 20px; }

    /* ---- KPI tiles ---- */
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .kpi {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px;
    }
    .kpi .label { color: var(--muted); font-size: 13px; }
    .kpi .value { font-size: 28px; font-weight: 650; margin-top: 2px; }
    .kpi .value small { font-size: 14px; font-weight: 400; color: var(--muted); }
    .kpi.alarm { border-color: var(--alarm); background: var(--alarm-bg); }
    .kpi.alarm .value { color: var(--alarm); }

    /* ---- Layout: zones + alarm log ---- */
    .layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
    @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }

    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }

    .zones { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .zone {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
      display: grid; gap: 14px;
    }
    .zone.has-alarm { border-color: var(--alarm); box-shadow: 0 0 0 1px var(--alarm); }
    .zone-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .zone-head h3 { margin: 0; font-size: 16px; }
    .zone-head .power { color: var(--muted); font-size: 13px; }

    /* ---- Metric rows with bars ---- */
    .metric { display: grid; gap: 4px; }
    .metric-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .metric-top .name { color: var(--muted); }
    .metric-top .reading { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .bar { position: relative; height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
    .bar .fill { height: 100%; width: 0; background: var(--fill); border-radius: 4px; transition: width .6s ease; }
    .bar .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--muted); opacity: .45; }
    .metric.warn  .fill { background: var(--warn); }
    .metric.alarm .fill { background: var(--alarm); }

    /* Status tag: text + colour, so it still works for colour-blind users */
    .tag {
      font-size: 11px; font-weight: 700; letter-spacing: .04em;
      padding: 1px 6px; border-radius: 4px; border: 1px solid transparent;
    }
    .tag.ok    { color: var(--muted); border-color: var(--border); }
    .tag.warn  { color: var(--warn);  background: var(--warn-bg);  border-color: var(--warn); }
    .tag.alarm { color: #fff;         background: var(--alarm);    border-color: var(--alarm); }

    /* ---- Controls ---- */
    .controls { display: grid; gap: 10px; border-top: 1px solid var(--border); padding-top: 12px; }
    .control { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
    .control > span { color: var(--muted); }

    .switch {
      min-width: 64px; padding: 6px 10px; border-radius: 6px; cursor: pointer;
      font: inherit; font-weight: 600; border: 1px solid var(--border);
      background: var(--track); color: var(--muted);
    }
    .switch[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

    .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .segmented button {
      font: inherit; padding: 6px 10px; border: 0; cursor: pointer;
      background: transparent; color: var(--muted); text-transform: capitalize;
    }
    .segmented button + button { border-left: 1px solid var(--border); }
    .segmented button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }

    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: .6; cursor: wait; }

    /* ---- Alarm log ---- */
    .log {
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
      max-height: 640px; overflow-y: auto;
    }
    .log ul { list-style: none; margin: 0; padding: 0; }
    .log li {
      display: grid; grid-template-columns: auto auto 1fr; gap: 8px; align-items: start;
      padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px;
    }
    .log li:last-child { border-bottom: 0; }
    .log time { color: var(--muted); }
    .log .tag.info { color: var(--accent); border-color: var(--accent); }
    .log .empty { padding: 20px; color: var(--muted); text-align: center; }

    /* ---- Error toast ---- */
    .toast {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      background: var(--alarm); color: #fff; padding: 10px 16px; border-radius: 8px;
      font-weight: 600; display: none; max-width: calc(100% - 32px);
    }
    .toast.show { display: block; }

    @media (max-width: 480px) {
      main { padding: 16px; }
      header { padding: 12px 16px; }
      .kpi .value { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="city">Future City <span>· Operations HMI</span></h1>
    <div class="conn" id="conn" role="status">
      <span class="dot"></span><span id="conn-text">Connecting…</span>
      <span class="num" id="clock"></span>
    </div>
  </header>

  <main>
    <section class="kpis" aria-label="City summary">
      <div class="kpi"><div class="label">Total demand</div><div class="value num" id="k-demand">–</div></div>
      <div class="kpi"><div class="label">Solar supply</div><div class="value num" id="k-solar">–</div></div>
      <div class="kpi"><div class="label">Average air quality</div><div class="value num" id="k-aqi">–</div></div>
      <div class="kpi" id="k-alarms-tile"><div class="label">Active alarms</div><div class="value num" id="k-alarms">–</div></div>
    </section>

    <div class="layout">
      <section aria-label="Zones">
        <h2>Zones</h2>
        <div class="zones" id="zones"></div>
      </section>
      <section aria-label="Event log">
        <h2>Event log</h2>
        <div class="log"><ul id="log"><li class="empty">No events yet</li></ul></div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast" role="alert"></div>

  <script>
    // The server replaces this placeholder with the value from config.py.
    const UPDATE_MS = Number("{{UPDATE_INTERVAL_MS}}") || 2000;

    // How long each bar is (the value that fills it to 100%).
    const SCALE = { traffic: 100, aqi: 200, grid_load: 120 };
    const METRICS = ["traffic", "aqi", "grid_load"];

    const $ = (id) => document.getElementById(id);
    const zoneEls = {};   // zone id -> references to its elements
    let busy = false;     // true while a command is being sent

    // ---- Build a zone card ONCE, then only update numbers -------------
    // (Re-building on every refresh would make buttons flicker and lose focus.)
    function buildZone(zone, data) {
      const card = document.createElement("article");
      card.className = "zone";

      const head = document.createElement("div");
      head.className = "zone-head";
      const title = document.createElement("h3");
      title.textContent = zone.name;
      const power = document.createElement("span");
      power.className = "power num";
      head.append(title, power);
      card.append(head);

      const metrics = {};
      for (const m of METRICS) {
        const t = data.thresholds[m];
        const row = document.createElement("div");
        row.className = "metric";
        row.innerHTML = `
          <div class="metric-top">
            <span class="name"></span>
            <span class="reading"><span class="num val"></span><span class="tag ok">OK</span></span>
          </div>
          <div class="bar"><div class="fill"></div>
            <div class="mark" style="left:${(t.warn / SCALE[m]) * 100}%"></div>
            <div class="mark" style="left:${(t.alarm / SCALE[m]) * 100}%"></div>
          </div>`;
        row.querySelector(".name").textContent = t.label;
        card.append(row);
        metrics[m] = { row, val: row.querySelector(".val"), tag: row.querySelector(".tag"), fill: row.querySelector(".fill"), unit: t.unit };
      }

      // Controls
      const controls = document.createElement("div");
      controls.className = "controls";

      const lightRow = document.createElement("div");
      lightRow.className = "control";
      lightRow.innerHTML = `<span>Streetlights</span>`;
      const lightBtn = document.createElement("button");
      lightBtn.className = "switch";
      lightBtn.addEventListener("click", () =>
        sendCommand(zone.id, "streetlights", lightBtn.getAttribute("aria-pressed") !== "true"));
      lightRow.append(lightBtn);

      const modeRow = document.createElement("div");
      modeRow.className = "control";
      modeRow.innerHTML = `<span>Traffic mode</span>`;
      const seg = document.createElement("div");
      seg.className = "segmented";
      seg.setAttribute("role", "group");
      seg.setAttribute("aria-label", `${zone.name} traffic mode`);
      const modeBtns = {};
      for (const mode of data.traffic_modes) {
        const b = document.createElement("button");
        b.textContent = mode;
        b.addEventListener("click", () => sendCommand(zone.id, "traffic_mode", mode));
        seg.append(b);
        modeBtns[mode] = b;
      }
      modeRow.append(seg);

      controls.append(lightRow, modeRow);
      card.append(controls);
      $("zones").append(card);

      zoneEls[zone.id] = { card, power, metrics, lightBtn, modeBtns };
    }

    function updateZone(zone) {
      const el = zoneEls[zone.id];
      el.power.textContent = `${zone.demand_kw} kW · ☀ ${zone.solar_kw} kW`;

      let anyAlarm = false;
      for (const m of METRICS) {
        const ref = el.metrics[m];
        const status = zone.status[m];
        ref.val.textContent = `${zone[m]} ${ref.unit}`;
        ref.tag.textContent = status.toUpperCase();
        ref.tag.className = `tag ${status}`;
        ref.row.className = `metric ${status}`;
        ref.fill.style.width = `${Math.min(zone[m] / SCALE[m], 1) * 100}%`;
        if (status === "alarm") anyAlarm = true;
      }
      el.card.classList.toggle("has-alarm", anyAlarm);

      el.lightBtn.setAttribute("aria-pressed", String(zone.streetlights));
      el.lightBtn.textContent = zone.streetlights ? "ON" : "OFF";
      el.lightBtn.setAttribute("aria-label", `${zone.name} streetlights ${zone.streetlights ? "on" : "off"}`);
      for (const [mode, b] of Object.entries(el.modeBtns)) {
        b.setAttribute("aria-pressed", String(zone.traffic_mode === mode));
      }
    }

    function updateLog(alarms) {
      const list = $("log");
      list.replaceChildren();
      if (!alarms.length) {
        list.innerHTML = `<li class="empty">No events yet</li>`;
        return;
      }
      for (const a of alarms) {
        const li = document.createElement("li");
        const time = document.createElement("time");
        time.className = "num";
        time.textContent = a.time;
        const tag = document.createElement("span");
        tag.className = `tag ${a.level}`;
        tag.textContent = a.level.toUpperCase();
        const msg = document.createElement("span");
        msg.textContent = a.message;   // textContent = safe, never runs HTML
        li.append(time, tag, msg);
        list.append(li);
      }
    }

    function render(data) {
      $("city").firstChild.textContent = `${data.city} `;
      $("clock").textContent = data.time;

      const s = data.summary;
      $("k-demand").innerHTML = `${s.total_demand_kw.toLocaleString()} <small>kW</small>`;
      $("k-solar").innerHTML  = `${s.total_solar_kw.toLocaleString()} <small>kW · ${s.solar_share}%</small>`;
      $("k-aqi").innerHTML    = `${s.avg_aqi} <small>AQI</small>`;
      $("k-alarms").textContent = s.active_alarms;
      $("k-alarms-tile").classList.toggle("alarm", s.active_alarms > 0);

      for (const zone of data.zones) {
        if (!zoneEls[zone.id]) buildZone(zone, data);
        updateZone(zone);
      }
      updateLog(data.alarms);
    }

    // ---- Talking to the Python server ---------------------------------
    function setConnected(ok) {
      $("conn").classList.toggle("lost", !ok);
      $("conn-text").textContent = ok ? "Live" : "Connection lost – retrying";
    }

    async function refresh() {
      try {
        const res = await fetch("/api/state");
        if (!res.ok) throw new Error(res.status);
        render(await res.json());
        setConnected(true);
      } catch (err) {
        setConnected(false);
      }
    }

    async function sendCommand(zone, control, value) {
      if (busy) return;
      busy = true;
      document.querySelectorAll(".controls button").forEach((b) => (b.disabled = true));
      try {
        const res = await fetch("/api/control", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ zone, control, value }),
        });
        const out = await res.json();
        if (!out.ok) showToast(out.error || "Command failed");
      } catch (err) {
        showToast("Could not reach the server");
      } finally {
        busy = false;
        document.querySelectorAll(".controls button").forEach((b) => (b.disabled = false));
        refresh();   // show the result right away
      }
    }

    let toastTimer;
    function showToast(text) {
      const t = $("toast");
      t.textContent = text;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
    }

    refresh();
    setInterval(refresh, UPDATE_MS);
  </script>
</body>
</html>
